<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>我的每日打卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
main{max-width:900px;margin:auto;padding:20px 14px 60px}.top{display:flex;justify-content:space-between;gap:12px}.title h1{margin:0;font-size:30px}.title p{margin:6px 0;color:#7b8496}
.card{background:#fff;border:1px solid #e8ebf1;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 2px 10px #1111}
button,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:#eef1f6;color:#172033}button.primary{background:#111827;color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#7b8496;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8f9fc;border-radius:14px;padding:15px}.stat b{display:block;font-size:28px;margin:4px 0}
.section-title{font-size:21px;margin:0 0 12px}.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}.habit{border:1px solid #e8ebf1;border-radius:15px;padding:14px;display:flex;align-items:center;gap:12px}.habit input{width:22px;height:22px}
.mood{display:flex;gap:8px;flex-wrap:wrap}.mood button.active{background:#111827;color:white}textarea{width:100%;min-height:110px;border:1px solid #e8ebf1;border-radius:13px;padding:12px}
.cal-head{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#7b8496;font-size:12px;padding:5px}.day{min-height:58px;border:1px solid #e8ebf1;border-radius:10px;background:#fff;padding:5px;text-align:center}.day.empty{background:transparent;border:0}.day.today{outline:2px solid #111827}.num{font-size:12px;color:#7b8496}.icons{font-size:18px;min-height:24px;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0}
@media(max-width:620px){main{padding:16px 10px 50px}.title h1{font-size:26px}.stats,.habits{grid-template-columns:1fr}.day{min-height:54px}}
</style>
</head>
<body>
<main>
<div class="top"><div class="title"><h1>我的每日打卡</h1><p>戒烟 · 早睡 · 今天没有手淫 · 健康饮食 · 运动 · 省钱/赚钱</p></div><button class="primary" id="clearToday">清空今天</button></div>

<div class="card"><div class="row between"><strong>今天记录哪一天？</strong><input id="dateInput" type="date"></div></div>

<div class="card stats">
<div class="stat"><span class="muted">连续戒烟</span><b id="smokeStreak">0 天</b><span class="muted">从最近一次吸烟记录计算</span></div>
<div class="stat"><span class="muted">今日完成</span><b id="todayPct">0%</b><span class="muted">六项打卡进度</span></div>
<div class="stat"><span class="muted">本月完成</span><b id="monthPct">0%</b><span class="muted">按每天六项平均</span></div>
</div>

<div class="card"><h2 class="section-title">今日打卡</h2><div class="habits" id="habits"></div></div>

<div class="card"><h2 class="section-title">今天的状态</h2>
<div class="mood" id="moods"><button data-mood="很好">😄 很好</button><button data-mood="一般">🙂 一般</button><button data-mood="有压力">😣 有压力</button><button data-mood="低落">😔 低落</button></div>
<div style="height:10px"></div><textarea id="notes" placeholder="记录一下今天：什么时候最想抽烟？几点睡的？有什么值得表扬自己的地方？"></textarea></div>

<div class="card"><div class="cal-head"><h2 class="section-title">月度日历</h2><div class="row"><button id="prev">‹</button><strong id="monthLabel"></strong><button id="next">›</button></div></div>
<div class="calendar" id="calendar"></div><p class="muted">🙂 三项关键目标全部完成　🚬 吸烟　💤 未按计划早睡　🧻 手淫</p></div>

<div class="card"><h2 class="section-title">数据</h2><div class="actions"><button id="exportBtn">导出数据 JSON</button><label class="filebtn"><button type="button">导入数据 JSON</button><input id="importFile" type="file" accept=".json,application/json"></label><button id="installBtn" style="display:none">安装到手机</button></div><p class="muted">数据默认保存在当前浏览器，导出 JSON 可备份。</p></div>
</main>
<script>
const HABITS=[["noSmoke","今天没有吸烟"],["earlySleep","按计划早睡"],["noMast","今天没有手淫"],["healthy","低热量健康饮食"],["exercise","运动健身"],["save","省一笔钱（赚一笔钱）"]];
const KEY="dailyCheckin_v11";let db=JSON.parse(localStorage.getItem(KEY)||"{}"),selected=new Date(),cal=new Date();
const pad=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,todayKey=key(new Date());
function rec(k){if(!db[k])db[k]={habits:{},mood:"很好",notes:""};return db[k]} function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){dateInput.value=key(selected);let r=rec(dateInput.value);habits.innerHTML=HABITS.map(([id,n])=>`<label class="habit"><input type="checkbox" data-id="${id}" ${r.habits[id]?"checked":""}><strong>${n}</strong></label>`).join("");habits.querySelectorAll("input").forEach(x=>x.onchange=()=>{rec(dateInput.value).habits[x.dataset.id]=x.checked;save()});notes.value=r.notes||"";document.querySelectorAll("#moods button").forEach(b=>b.classList.toggle("active",b.dataset.mood===r.mood));renderStats();renderCal()}
dateInput.onchange=()=>{selected=new Date(dateInput.value+"T12:00:00");render()};notes.oninput=()=>{rec(dateInput.value).notes=notes.value;localStorage.setItem(KEY,JSON.stringify(db))};
document.querySelectorAll("#moods button").forEach(b=>b.onclick=()=>{rec(dateInput.value).mood=b.dataset.mood;save()});
clearToday.onclick=()=>{if(confirm("确定清空今天的记录吗？")){delete db[dateInput.value];save()}};
function renderStats(){let r=rec(dateInput.value),done=HABITS.filter(([id])=>r.habits[id]).length;todayPct.textContent=Math.round(done/6*100)+"%";let ym=dateInput.value.slice(0,7),days=Object.keys(db).filter(k=>k.startsWith(ym)),total=0,count=0;days.forEach(k=>HABITS.forEach(([id])=>{count++;if(db[k].habits?.[id])total++}));monthPct.textContent=(count?Math.round(total/count*100):0)+"%";let d=new Date(),streak=0;while(true){let rr=db[key(d)];if(rr?.habits?.noSmoke){streak++;d.setDate(d.getDate()-1)}else break}smokeStreak.textContent=streak+" 天"}
function iconFor(r){if(!r?.habits)return"";let a=r.habits,f=[];if(!a.noSmoke)f.push("🚬");if(!a.earlySleep)f.push("💤");if(!a.noMast)f.push("🧻");return f.length?f.join(" "):"🙂"}
function renderCal(){let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);monthLabel.textContent=`${y}年 ${m+1}月`;let h=["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");for(let i=0;i<first.getDay();i++)h+=`<div class="day empty"></div>`;for(let n=1;n<=last.getDate();n++){let d=new Date(y,m,n),k=key(d);h+=`<button class="day ${k===todayKey?"today":""}" data-day="${k}"><div class="num">${n}</div><div class="icons">${iconFor(db[k])}</div></button>`}calendar.innerHTML=h;calendar.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.day+"T12:00:00");render()})}
prev.onclick=()=>{cal.setMonth(cal.getMonth()-1);renderCal()};next.onclick=()=>{cal.setMonth(cal.getMonth()+1);renderCal()};
exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="我的每日打卡备份.json";a.click()};
importFile.onchange=async e=>{try{db=JSON.parse(await e.target.files[0].text());save();alert("导入成功")}catch{alert("导入失败：不是有效的 JSON")}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js").catch(()=>{});render();
</script>
</body></html>
